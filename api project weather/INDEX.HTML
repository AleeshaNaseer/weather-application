<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00c6fb);
}

.container{
    width:360px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
    color:#333;
}

.search{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    padding:12px 18px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#0056b3;
}

.weather{
    margin-top:25px;
    display:none;
}

.weather img{
    width:90px;
}

.temp{
    font-size:50px;
    font-weight:bold;
    color:#222;
    margin:10px 0;
}

.city{
    font-size:28px;
    font-weight:bold;
}

.condition{
    font-size:20px;
    color:#666;
    margin-top:5px;
}

.info{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:#f3f3f3;
    padding:12px;
    border-radius:10px;
}

.card h3{
    color:#007BFF;
    margin-bottom:5px;
}

.error{
    color:red;
    margin-top:20px;
    display:none;
}
</style>

</head>
<body>

<div class="container">

    <h1>🌤 Weather App</h1>

    <div class="search">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <p class="error" id="error"></p>

    <div class="weather" id="weather">

        <img id="icon">

        <div class="city" id="city"></div>

        <div class="temp" id="temp"></div>

        <div class="condition" id="condition"></div>

        <div class="info">

            <div class="card">
                <h3>Humidity</h3>
                <p id="humidity"></p>
            </div>

            <div class="card">
                <h3>Wind</h3>
                <p id="wind"></p>
            </div>

            <div class="card">
                <h3>Country</h3>
                <p id="country"></p>
            </div>

            <div class="card">
                <h3>Feels Like</h3>
                <p id="feels"></p>
            </div>

        </div>

    </div>

</div>

<script>

const apiKey = "82563321281b4a5bbff221336261107";

async function getWeather(){

    const city = document.getElementById("cityInput").value.trim();

    if(city==""){
        alert("Please enter a city name.");
        return;
    }

    const url=`https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=yes`;

    try{

        const response=await fetch(url);
        const data=await response.json();

        if(data.error){
            document.getElementById("weather").style.display="none";
            document.getElementById("error").style.display="block";
            document.getElementById("error").innerHTML=data.error.message;
            return;
        }

        document.getElementById("error").style.display="none";
        document.getElementById("weather").style.display="block";

        document.getElementById("city").innerHTML=data.location.name;
        document.getElementById("country").innerHTML=data.location.country;

        document.getElementById("temp").innerHTML=data.current.temp_c+" °C";

        document.getElementById("condition").innerHTML=data.current.condition.text;

        document.getElementById("humidity").innerHTML=data.current.humidity+" %";

        document.getElementById("wind").innerHTML=data.current.wind_kph+" km/h";

        document.getElementById("feels").innerHTML=data.current.feelslike_c+" °C";

        document.getElementById("icon").src="https:"+data.current.condition.icon;

    }
    catch(error){
        document.getElementById("error").style.display="block";
        document.getElementById("error").innerHTML="Unable to fetch weather data.";
        document.getElementById("weather").style.display="none";
    }

}

document.getElementById("cityInput").addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        getWeather();
    }
});

</script>

</body>
</html>
